name: ci

on:
  push:
  pull_request:

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required project docs exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/superpowers/specs/2026-04-28-tencent-dingdang-photo-frame-design.md
          test -f docs/superpowers/plans/2026-04-28-tencent-dingdang-photo-frame.md

  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: ./gradlew testDebugUnitTest
